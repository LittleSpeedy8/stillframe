<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · {{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include '_header.html' %}

  <main class="main-container error-page">
    <p class="eyebrow">NOT FOUND</p>
    <p class="error-code">404</p>
    <h1>This page doesn't exist</h1>
    <p class="error-text">
      The link may be broken, or the video may have been deleted.
    </p>
    <div class="error-actions">
      <a class="button button-upload" href="{{ url_for('index') }}">Back to home</a>
      {% if user %}
        <a class="button button-quiet" href="{{ url_for('my_videos') }}">My videos</a>
      {% endif %}
    </div>
  </main>

  <footer class="footer">
    <span>{{ site_name|upper }}</span>
    <span>Built with Flask</span>
  </footer>
</body>
</html>
